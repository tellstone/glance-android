name: Release beta

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed beta
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, verify, and sign release APK
        env:
          GLANCE_RELEASE_KEYSTORE_BASE64: ${{ secrets.GLANCE_RELEASE_KEYSTORE_BASE64 }}
          GLANCE_RELEASE_STORE_PASSWORD: ${{ secrets.GLANCE_RELEASE_STORE_PASSWORD }}
          GLANCE_RELEASE_KEY_ALIAS: ${{ secrets.GLANCE_RELEASE_KEY_ALIAS }}
          GLANCE_RELEASE_KEY_PASSWORD: ${{ secrets.GLANCE_RELEASE_KEY_PASSWORD }}
          GLANCE_DONATION_ON_CHAIN: ${{ secrets.GLANCE_DONATION_ON_CHAIN }}
          GLANCE_DONATION_LIGHTNING: ${{ secrets.GLANCE_DONATION_LIGHTNING }}
        run: |
          keyStorePath="$RUNNER_TEMP/glance-release.jks"
          printf '%s' "$GLANCE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyStorePath"
          export GLANCE_RELEASE_STORE_FILE="$keyStorePath"
          ./gradlew --no-daemon -PglanceVersionName="${GITHUB_REF_NAME#v}" verifyReleaseConfiguration :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :core-crypto:test :core-network:test :core-data:test :core-security:test :app:verifyReleaseLoggingStripped
          mv app/build/outputs/apk/release/app-release.apk "glance-${GITHUB_REF_NAME}.apk"
          sha256sum "glance-${GITHUB_REF_NAME}.apk" > "glance-${GITHUB_REF_NAME}.apk.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "glance-${GITHUB_REF_NAME}.apk" "glance-${GITHUB_REF_NAME}.apk.sha256" --verify-tag --title "Glance $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Install Zapstore publisher
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        run: go install github.com/zapstore/zsp@v0.4.17
      - name: Validate Zapstore release source
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        run: |
          grep -Eq '^pubkey: npub1[0-9a-z]+$' zapstore.yaml
          zspPath="$(go env GOPATH)/bin/zsp"
          "$zspPath" publish --check zapstore.yaml
      - name: Publish to Zapstore beta channel
        if: vars.ZAPSTORE_PUBLISH_ENABLED == 'true'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zspPath="$(go env GOPATH)/bin/zsp"
          "$zspPath" publish --quiet --overwrite-release --channel beta --commit "$GITHUB_SHA" zapstore.yaml
